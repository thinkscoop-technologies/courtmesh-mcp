name: Publish to npm

# Fires only on a pushed tag matching v*, e.g. v0.5.0. See RELEASING.md for the
# exact steps. This workflow never runs on an ordinary push or pull request,
# and never bumps the version itself: it publishes exactly what was committed
# and tagged.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm provenance: the OIDC token that lets npm attest this
  # package was built by this exact workflow run, from this exact commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run end to end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
